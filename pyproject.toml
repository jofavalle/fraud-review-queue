[project]
name = "fraudq"
version = "0.1.0"
description = "Cost-optimal allocation of a capacity-constrained manual fraud review queue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.4",
    "fastapi>=0.139.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "streamlit>=1.59.1",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "kaggle>=2.2.4",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
package = ["src/fraudq"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# The rule set is declared, not inherited. Left implicit, it is whatever the
# installed ruff decides that day: 0.16 widened its defaults and turned the
# repository red without a line of code changing. E402 lives inside E4, which
# is what makes the `# noqa: E402` on an import placed after a
# `pytest.importorskip` a justified suppression rather than dead weight.
#
# E501 is the one addition to that historical default, and it is here because
# the formatter does not cover it: `ruff format` rewraps code, never the text
# inside a comment or a string. Without E501 an overlong line of prose reaches
# the repository unopposed.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]
