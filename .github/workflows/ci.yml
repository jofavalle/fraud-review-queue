# CI: pytest + ruff (design.md §11.3). Delegable (plan §5.3).
#
# Badge para el README (ajusta usuario si hace falta):
#   [![CI](https://github.com/jofavalle/fraud-review-queue/actions/workflows/ci.yml/badge.svg)](https://github.com/jofavalle/fraud-review-queue/actions/workflows/ci.yml)
#
# Las dependencias se instalan con lista explícita + `-e . --no-deps`: el CI no
# depende de cómo estén declarados los extras en pyproject.toml, y la lista es
# visible en el propio workflow. Si añades una dependencia al proyecto,
# añádela también aquí — el CI en rojo te lo va a recordar.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow duckdb scikit-learn lightgbm \
                      fastapi httpx pydantic "uvicorn[standard]" \
                      pytest ruff
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check src tests app

      - name: Tests
        run: pytest -q
