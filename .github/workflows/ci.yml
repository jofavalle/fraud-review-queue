# CI: ruff check, ruff format --check, pytest. The same gate a developer runs
# locally, on the same paths.
#
# Badge for the README:
#   [![CI](https://github.com/jofavalle/fraud-review-queue/actions/workflows/ci.yml/badge.svg)](https://github.com/jofavalle/fraud-review-queue/actions/workflows/ci.yml)
#
# The environment comes from `uv.lock` and nothing else. An earlier version of
# this workflow installed a hand written list of packages with pip, which meant
# two sources of truth that had to be kept in sync by hand, and an unpinned ruff
# whose defaults changed under the repository. `uv sync --locked` fails outright
# if the lock and pyproject.toml disagree, so a new dependency reaches CI the
# moment it is added, and the runner builds the same environment as a developer.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Major tag, which this action does publish: refs/tags/v7 resolves.
      - uses: actions/checkout@v7

      # Full version: this action publishes no moving major tag, only v9.0.0.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check src tests app

      # Formatting is checked, not applied. Left to a habit it drifts silently:
      # eighteen files had accumulated before anything asked.
      - name: Format (ruff)
        run: uv run ruff format --check src tests app

      - name: Tests
        run: uv run pytest -q
